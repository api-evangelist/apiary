provider: Apiary
providerId: apiary
description: >-
  First-party client libraries, parsers and testing tooling published by Apiary
  (github.com/apiaryio). Apiary ships no SDK for the Apiary API itself in any
  language other than Ruby — the `apiaryio` gem is the Apiary CLI and is the only
  package that calls api.apiary.io. Everything else Apiary publishes is tooling
  for the API description formats (API Blueprint parsers) and for contract testing
  (Dredd, Gavel), not a client for the Apiary API.
note: >-
  CURRENCY IS THE HEADLINE FINDING. Every first-party package below has a latest
  release dated 2021 or earlier, and the entire apiaryio GitHub organization was
  archived on 2024-11-08 (observed on github.com/apiaryio, 2026-09-02) — including
  api-blueprint, dredd, drafter, protagonist and api-elements.js, all of which
  carry GitHub's archived banner. The Apiary API description document these
  packages target was itself last updated 2020-03-02. The hosted service remains
  live and answers requests; the client-side estate around it does not appear to
  be maintained.
