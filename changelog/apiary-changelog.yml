description: >-
  Apiary publishes a machine-readable change feed for its own API, in Atom and RSS,
  generated by the same version-history feature it gives every customer's API
  Project. Fetched verbatim on 2026-09-02.
scheme: per-project-change-feed
scheme_detail: >-
  Every Apiary API Project automatically gets a feed at
  https://<project>.docs.apiary.io/feed (Atom) and /feed/rss (RSS). Each entry links
  to a diffing UI at app.apiary.io/<project>/diff/<revision-id> showing what changed
  between that revision and its predecessor. Apiary documents using this feed to
  trigger a CI build or notify downstream consumers — an event surface built out of
  the changelog rather than webhooks.
