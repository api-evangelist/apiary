specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Apiary
providerId: apiary
created: '2026-05-04'
modified: '2026-09-02'
generated: '2026-09-02'
method: searched
source: https://apiary.io/plans
description: >-
  Apiary's published plans, read from apiary.io/plans on 2026-09-02. Apiary names
  three tiers and publishes their feature and collaborator limits in full, but
  publishes NO PRICE for any of them — there is no figure, no currency and no
  billing period anywhere on the plans page. Pricing is obtained by contacting
  Apiary/Oracle.
note: >-
  THIS FILE REPLACES A SCAFFOLD. The previous revision (method: generated,
  2026-05-04) invented a free/professional/enterprise ladder with 1,000 and 100,000
  request monthly quotas and per-minute rate entries. Apiary does not meter its plans
  by API request at all — it meters them by collaborators per API Project, team
  membership and feature access. Those invented quotas have been removed rather than
  corrected, because there was nothing to correct them to.
plan_count: 3
currency: null
billing_period: null
pricing_published: false
pricing_note: >-
  apiary.io/plans (HTTP 200, fetched 2026-09-02) lists tier names, collaborator
  limits and feature matrices but no monetary amount for any tier. Recorded as
  unpublished, not as free.
