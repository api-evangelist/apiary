metering_model:
  basis: seats-and-features
  note: >-
    Apiary does not meter or price by API call. The commercial axes are collaborators
    per API Project, team membership, read-only viewers, and access to features
    (private projects, embed, style guide, GitHub Enterprise). The one documented
    request-rate ceiling in the product — the Mock Server's 120/5000 per minute —
    is not attached to a plan; see rate-limits/apiary-rate-limits.yml.
